<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>SPMS Dashboard</title>

</head>

<body>

<h1>SMART PATROL MANAGEMENT SYSTEM</h1>

<button onclick="loadDashboard()">

Load Dashboard

</button>

<div id="card"></div>

<table border="1" width="100%">

<thead>

<tr>
<th>Waktu</th>
<th>Nama</th>
<th>Wilayah</th>
<th>Checkpoint</th>
<th>Situasi</th>
</tr>

</thead>

<tbody id="tableData">

</tbody>

</table>

<script>

const API="https://script.google.com/macros/s/AKfycbwvMYlVBsxjef7-OVHqmiaUX0gecof7VEG2-JlMyp0sAeeJj_ANslssKDpXQJX-pbgY/exec";


async function loadDashboard(){

    const response = await fetch(
      API+"?action=getDashboard"
    );

    const result = await response.json();


    const data=result.data;


    document.getElementById("card").innerHTML=`

    <h2>Total Patrol : ${result.total}</h2>

    `;



    let html="";


    for(let i=1;i<data.length;i++){

        html +=`

        <tr>

        <td>${data[i][0]}</td>

        <td>${data[i][1]}</td>

        <td>${data[i][4]}</td>

        <td>${data[i][6]}</td>

        <td>${data[i][7]}</td>

        </tr>

        `;

    }


    document.getElementById("tableData").innerHTML=html;


}


</script>

</body>

</html>
