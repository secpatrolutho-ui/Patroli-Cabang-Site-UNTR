<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SPMS Dashboard</title>

<style>

body{
font-family:Arial, sans-serif;
background:#0B1F3A;
margin:0;
color:white;
}


.header{

background:#F4C400;
color:#002B5B;
padding:20px;
text-align:center;

}


button{

background:#005BAC;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;

}


.container{

padding:20px;

}


.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;

}



.card{

background:white;
color:#002B5B;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.2);

}


.number{

font-size:35px;
font-weight:bold;

}



.filter-box,
.table-box{

background:white;
color:#333;
margin-top:25px;
padding:20px;
border-radius:15px;

}



select,
input{

padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin:5px;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#F4C400;
color:#002B5B;

}



td,th{

padding:12px;
border-bottom:1px solid #ddd;
text-align:left;

}



</style>

</head>

<body>

<div class="header">

<h1>
SMART PATROL MANAGEMENT SYSTEM
</h1>

<h3>
PT UNITED TRACTORS Tbk
</h3>

<button onclick="loadDashboard()">
LOAD DASHBOARD
</button>

</div>

<div class="container">

<div class="cards">

<div class="card">

Total Patrol

<div class="number" id="total">
0
</div>

</div>

<div class="card">

Petugas Aktif

<div class="number" id="petugas">
0
</div>

</div>

<div class="card">

Checkpoint

<div class="number" id="checkpoint">
0
</div>

</div>

<div class="card">

Temuan

<div class="number" id="temuan">
0
</div>

</div>

</div>

<div class="filter-box">

<h2>
Filter Monitoring
</h2>

<label>
Tanggal
</label>

<input type="date" id="tanggal">

<br>

<label>
Wilayah
</label>

<select id="wilayah">

<option value="">
Semua Wilayah
</option>

</select>

<br>

<label>
Petugas
</label>

<select id="nama">

<option value="">
Semua Petugas
</option>

</select>

<br>

<button onclick="loadDashboard()">

Terapkan Filter

</button>

</div>

<div class="table-box">

<h2>
Riwayat Patroli
</h2>

<table>

<thead>

<tr>

<th>Waktu</th>

<th>Nama</th>

<th>Wilayah</th>

<th>Checkpoint</th>

<th>Situasi</th>

</tr>

</thead>

<tbody id="tableData">

</tbody>

</table>

</div>

</div>

<script>


const API=

"https://script.google.com/macros/s/AKfycbwvMYlVBsxjef7-OVHqmiaUX0gecof7VEG2-JlMyp0sAeeJj_ANslssKDpXQJX-pbgY/exec";





async function loadDashboard(){



let url=

API+

"?action=getDashboard"

+"&tanggal="+

document.getElementById("tanggal").value

+"&wilayah="+

document.getElementById("wilayah").value

+"&nama="+

document.getElementById("nama").value;




const response=

await fetch(url);



const result=

await response.json();




document.getElementById("total").innerHTML=
result.total;


document.getElementById("petugas").innerHTML=
result.petugas;


document.getElementById("checkpoint").innerHTML=
result.checkpoint;


document.getElementById("temuan").innerHTML=
result.temuan;



let html="";



const data=result.data;



for(let i=1;i<data.length;i++){


html+=`

<tr>

<td>${new Date(data[i][0]).toLocaleString("id-ID")}</td>

<td>${data[i][1]}</td>

<td>${data[i][4]}</td>

<td>${data[i][6]}</td>

<td>${data[i][7]}</td>


</tr>


`;

}



document.getElementById("tableData").innerHTML=html;



updateFilter(data);



}





function updateFilter(data){


let wilayah=document.getElementById("wilayah");

let nama=document.getElementById("nama");



let wilayahSet=new Set();

let namaSet=new Set();



for(let i=1;i<data.length;i++){


wilayahSet.add(data[i][4]);

namaSet.add(data[i][1]);


}



wilayah.innerHTML=
'<option value="">Semua Wilayah</option>';

nama.innerHTML=
'<option value="">Semua Petugas</option>';



wilayahSet.forEach(x=>{

wilayah.innerHTML+=

`<option value="${x}">${x}</option>`;

});



namaSet.forEach(x=>{

nama.innerHTML+=

`<option value="${x}">${x}</option>`;

});



}



</script>

</body>

</html>
