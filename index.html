<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patroli Digital Cabang & Site</title>

<!-- CSS -->

<link rel="stylesheet"
href="css/style.css">

<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Google Font -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <img
    src="img/logo-ut.png"
    class="logo">

    <div>

        <h1>PATROLI DIGITAL</h1>

        <p>Cabang & Site</p>

    </div>

</header>

<!-- ================= CONTAINER ================= -->

<div class="container">

    <!-- ================= PERSONEL ================= -->

    <div class="card">

        <h3>

            <i class="fa-solid fa-user"></i>

            Informasi Personel

        </h3>

        <div class="info">

            <label>Nama</label>

            <span id="nama">Memuat...</span>

        </div>

        <div class="info">

            <label>NRP</label>

            <span id="nrp">Memuat...</span>

        </div>

    </div>

    <!-- ================= CHECKPOINT ================= -->

    <div class="card">

        <h3>

            <i class="fa-solid fa-location-dot"></i>

            Checkpoint

        </h3>

        <div class="info">

            <label>Lokasi</label>

            <span id="lokasi">-</span>

        </div>

        <div class="info">

            <label>Wilayah</label>

            <span id="wilayah">-</span>

        </div>

        <div class="info">

            <label>Checkpoint ID</label>

            <span id="checkpointId">-</span>

        </div>

        <div class="info">

            <label>Checkpoint</label>

            <span id="checkpoint">-</span>

        </div>

    </div>

    <!-- ================= GPS ================= -->

    <div class="card">

        <h3>

            <i class="fa-solid fa-satellite-dish"></i>

            Status GPS

        </h3>

        <div class="info">

            <label>Status</label>

            <span id="gpsStatus"
            class="status-warning">

                Mencari Lokasi...

            </span>

        </div>

        <div class="info">

            <label>Jarak</label>

            <span id="distance">

                0 Meter

            </span>

        </div>

        <div class="progress">

            <div
            id="progressBar"
            class="progress-bar">

            </div>

        </div>

    </div>

    <!-- ================= SITUASI ================= -->

    <div class="card">

        <h3>

            <i class="fa-solid fa-circle-exclamation"></i>

            Situasi Patroli

        </h3>

        <div class="form-group">

            <select id="situasi">

                <option value="K10">
                    K10 - Aman dan Terkendali
                </option>

                <option value="K01">
                    K01 - Bangunan & Akses
                </option>

                <option value="K02">
                    K02 - Alat Kerja & Mekanik
                </option>

                <option value="K03">
                    K03 - Peralatan Kantor
                </option>

                <option value="K04">
                    K04 - Kendaraan
                </option>

                <option value="K05">
                    K05 - Kelistrikan
                </option>

                <option value="K06">
                    K06 - Air & Sanitasi
                </option>

                <option value="K07">
                    K07 - Pencahayaan
                </option>

                <option value="K08">
                    K08 - Lingkungan & Cuaca
                </option>

                <option value="K09">
                    K09 - Security & Emergency
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>

                Deskripsi

            </label>

            <textarea

            id="deskripsi"

            placeholder="Masukkan deskripsi temuan..."

            
            </textarea>

        </div>

    </div>

    <!-- ================= BUTTON ================= -->

    <button
    id="btnSubmit"
    disabled>

        <i class="fa-solid fa-paper-plane"></i>

        SUBMIT PATROLI

    </button>

</div>

<!-- ================= LOADING ================= -->

<div
id="loading"
class="loading">

<div class="spinner"></div>

<p>

Mohon Tunggu...

</p>

</div>

<!-- ================= FOOTER ================= -->

<footer>

Security Department

<br>

PT United Tractors Tbk

</footer>

<!-- ================= JAVASCRIPT ================= -->

<script src="js/config.js"></script>

<script src="js/utils.js"></script>

<script src="js/auth.js"></script>

<script src="js/checkpoint.js"></script>

<script src="js/gps.js"></script>

<script src="js/submit.js"></script>

<script src="js/patrol.js"></script>

</body>

</html>
