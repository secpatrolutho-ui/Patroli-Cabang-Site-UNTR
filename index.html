<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patroli Digital Cabang & Site</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<header>

<img src="img/logo-ut.png" class="logo">

<h1>Patroli Digital</h1>

<p>Cabang & Site</p>

</header>


<div class="card">

<h3>Informasi Personel</h3>

<div class="item">

<label>Nama</label>

<span id="nama">
Memuat...
</span>

</div>

<div class="item">

<label>NRP</label>

<span id="nrp">
Memuat...
</span>

</div>

</div>


<div class="card">

<h3>Checkpoint</h3>

<div class="item">

<label>Wilayah</label>

<span id="wilayah">
-
</span>

</div>

<div class="item">

<label>Checkpoint</label>

<span id="checkpoint">
-
</span>

</div>

</div>


<div class="card">

<h3>Status GPS</h3>

<div class="gps-status loading">

<span>

📡

</span>

<span id="gpsStatus">

Mencari lokasi...

</span>

</div>

</div>


<div class="card">

<h3>Jarak</h3>

<div class="distance">

<span id="distance">

0 Meter

</span>

</div>

</div>


<div class="card">

<h3>Situasi Patroli</h3>

<select id="situasi">

<option value="K10">

K10 - Aman dan Terkendali

</option>

<option value="K01">

K01 - Bangunan & Akses

</option>

<option value="K02">

K02 - Alat Kerja & Mekanik

</option>

<option value="K03">

K03 - Peralatan Kantor

</option>

<option value="K04">

K04 - Kendaraan

</option>

<option value="K05">

K05 - Kelistrikan

</option>

<option value="K06">

K06 - Air & Sanitasi

</option>

<option value="K07">

K07 - Pencahayaan

</option>

<option value="K08">

K08 - Lingkungan & Cuaca

</option>

<option value="K09">

K09 - Security & Emergency

</option>

</select>

</div>


<button id="submitBtn">

SUBMIT PATROLI

</button>


<footer>

Security Department

<br>

PT United Tractors Tbk

</footer>

</div>

<script src="js/patrol.js"></script>

</body>

</html>
